<script>
    const API_ENDPOINT = "/api/collect"; 

    async function collectData() {
        console.log("Iniciando coleta de dados...");
        let ipAddress = "Desconhecido";
        let userEmail = "Não fornecido";

        try {
            // 1. Captura o IP
            const ipResponse = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipResponse.json();
            ipAddress = ipData.ip;

            // 2. Captura o e-mail via URL
            const urlParams = new URLSearchParams(window.location.search);
            userEmail = urlParams.get('email') || "Não fornecido";

            console.log("IP capturado:", ipAddress);
            console.log("Email capturado:", userEmail);

            // 3. Envia para a sua API
            await sendToServer({
                ip: ipAddress,
                email: userEmail,
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString()
            });

        } catch (error) {
            console.error("Erro na coleta inicial:", error);
            atualizarStatus("Erro na conexão. Tente novamente.");
        }
    }

    async function sendToServer(data) {
        try {
            console.log("Enviando payload para API...", data);

            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            console.log("Resposta do servidor:", result);

            if (response.ok) {
                atualizarStatus("Verificação concluída. Redirecionando...");
                setTimeout(() => {
                    const btn = document.getElementById('btn-action');
                    if(btn) btn.classList.remove('hidden');
                }, 2000);
            } else {
                throw new Error(result.error || 'Erro no servidor');
            }

        } catch (error) {
            console.error("Erro ao enviar para o servidor:", error);
            atualizarStatus("Erro no servidor. Tente novamente.");
        }
    }

    // FUNÇÃO PARA EVITAR O ERRO DE "innerText is null"
    function atualizarStatus(mensagem) {
        const statusEl = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');
        const btn = document.getElementById('btn-action');

        if (statusEl) statusEl.innerText = mensagem;
        if (spinner) spinner.style.display = 'none';
        if (btn) btn.classList.remove('hidden');
    }

    function startSimulation() {
        alert("Sua conexão foi validada com sucesso!");
        window.location.reload();
    }

    window.onload = collectData;
</script>
